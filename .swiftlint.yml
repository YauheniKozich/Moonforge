# SwiftLint Configuration for Moonforge
# Documentation: https://realm.github.io/SwiftLint/rule-directory.html

#---------------------------------------------
# INCLUDED & EXCLUDED PATHS
#---------------------------------------------
included:
  - Moonforge
  - MoonforgeTests

excluded:
  - Moonforge/TestViews
  - Carthage
  - Pods
  - .build
  - DerivedData

#---------------------------------------------
# REPORTER TYPE
#---------------------------------------------
reporter: "xcode"

#---------------------------------------------
# RULES CONFIGURATION
#---------------------------------------------

# Line Length
line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

# Type Body Length
type_body_length:
  warning: 400
  error: 600

# File Length
file_length:
  warning: 600
  error: 1000

# Function Body Length
function_body_length:
  warning: 60
  error: 120

# Cyclomatic Complexity
cyclomatic_complexity:
  warning: 15
  error: 25

# Nesting
nesting:
  type_level: 3
  function_level: 6

# Large Tuple
large_tuple:
  warning: 4
  error: 5

# Function Parameter Count
function_parameter_count:
  warning: 6
  error: 8

# Identifier Name
identifier_name:
  min_length:
    warning: 1
    error: 1
  max_length:
    warning: 50
    error: 70
  allowed_symbols: ["_"]
  # Allow common mathematical variable names
  excluded:
    - x
    - y
    - z
    - a
    - b
    - c
    - d
    - e
    - f
    - g
    - h
    - i
    - j
    - k
    - l
    - m
    - n
    - o
    - p
    - q
    - r
    - s
    - t
    - u
    - v
    - w

# Type Name
type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 50
    error: 70

# Trailing Whitespace
trailing_whitespace:
  severity: warning
  ignores_empty_lines: true
  ignores_comments: false

# Trailing Newline
trailing_newline: warning

# Trailing Comma
trailing_comma:
  severity: warning
  mandatory_comma: false

# Colon
colon:
  severity: warning
  flexible_right_spacing: false

# Comma
comma: warning

# Control Statement
control_statement: warning

# Empty Parentheses with Trailing Closure
empty_parentheses_with_trailing_closure: warning

# Redundant Void Return
redundant_void_return: warning

# Vertical Whitespace
vertical_whitespace:
  max_empty_lines: 3

#---------------------------------------------
# DISABLED RULES
#---------------------------------------------
disabled_rules:
  - todo
  - force_try
  - force_cast
  - implicitly_unwrapped_optional

#---------------------------------------------
# OPT-IN RULES
#---------------------------------------------
opt_in_rules:
  - empty_count
  - first_where
  - joined_default_parameter
  - legacy_random
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - static_operator
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - vertical_whitespace_between_cases
  - weak_delegate

#---------------------------------------------
# CUSTOM RULES
#---------------------------------------------
custom_rules:
  # Discourage print statements in production code
  no_print_in_production:
    name: "No Print Statements"
    regex: '^\s*print\s*\('
    message: "Use Logger protocol instead of print() for production code"
    severity: warning
    excluded: ".*Tests.*"
